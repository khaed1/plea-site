<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>%PLEA_TITLE%</title>
    <meta
      name="description"
      content="%PLEA_DESCRIPTION%"
    />
    <meta property="og:title" content="%PLEA_OG_TITLE%" />
    <meta
      property="og:description"
      content="%PLEA_OG_DESCRIPTION%"
    />
    <meta property="og:image" content="%PLEA_OG_IMAGE%" />
    <meta property="og:url" content="%PLEA_OG_URL%"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="675"/>
    <meta property="og:image:alt" content="%PLEA_OG_IMAGE_ALT%"/>
    <meta name="twitter:image" content="%PLEA_OG_IMAGE%"/>
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("plea-theme") === "dark" ? "dark" : "light";
      } catch {}
    </script>
    <script src="./text-check.js"></script>
    <script src="./icons.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
